[project]
name = "repair-loop"
version = "0.1.0"
description = "Deterministic, budgeted multi-agent software repair loop"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "openai>=1.50",
  "pydantic>=2.9",
  "PyYAML>=6.0.2",
  "tenacity>=9.0",
  "typer>=0.12",
  "wandb>=0.18",
  "weave>=0.51",
]

[project.optional-dependencies]
demo = ["altair>=5.5", "marimo>=0.20", "pandas>=2.2"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
repair-loop = "repair_loop.cli:main"
repair-loop-sandbox = "repair_loop.sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repair_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["benchmarks/cases", "notebooks"]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP046"]

[tool.ruff.format]
exclude = ["benchmarks/cases"]
