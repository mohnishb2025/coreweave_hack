name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,demo]"
      - name: Static checks
        run: |
          python -m compileall -q src notebooks
          ruff check .
          ruff format --check .
      - name: Unit tests
        env:
          WANDB_MODE: offline
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Docker execution
        run: |
          docker build -t repair-loop-runner:latest -f docker/Dockerfile .
          docker run --rm --network none --read-only --cap-drop ALL repair-loop-runner:latest python -c "print('sandbox ready')"
